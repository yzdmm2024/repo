name: Build AppData (test)

on:
  push:
    branches: [ appdata ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: A
        run: echo "hello from CI, actor=${{ github.actor }}"
      - name: B clone
        run: |
          git clone --depth 1 -b appdata https://github.com/yzdmm2024/repo.git src
          ls -la src/appdata
      - name: C theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          git -C $HOME/theos submodule update --init --recursive --depth 1
          ls $HOME/theos | head
      - name: D sdk
        run: |
          mkdir -p $HOME/theos/sdks
          curl -fL --retry 3 -o /tmp/sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xJf /tmp/sdk.tar.xz -C $HOME/theos/sdks
          ls $HOME/theos/sdks
      - name: E build
        run: |
          export THEOS=$HOME/theos
          export PATH="$THEOS/bin:$PATH"
          export THEOS_MAKE_PATH="$THEOS/makefiles"
          cd src/appdata
          ls -la
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 2>&1 | tail -100
          ls -la packages/ || echo "NO PACKAGES"
