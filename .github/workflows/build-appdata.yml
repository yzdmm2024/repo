name: Build AppData (Fila, rootless) -> publish to source

# 流程：编译 AppData(Fila 适配版) -> 打包 rootless deb
#       -> 把 deb 推进本仓库 main 分支的 debs/ 目录，并重建 Cydia/Sileo 索引
# 全程只用仓库自带的 GITHUB_TOKEN，不需要任何外部 PAT / Secret

on:
  push:
    branches: [ appdata ]
    paths-ignore:
      - 'ci-out/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: STEP1 show env
        run: |
          echo "actor=${{ github.actor }}  sha=${{ github.sha }}"
          echo "pwd=$(pwd)"

      - name: STEP2 checkout source (appdata branch)
        uses: actions/checkout@v4
        with:
          ref: appdata
          path: src

      - name: STEP2b list source
        run: |
          ls -la src
          ls -la src/appdata

      - name: STEP3 install theos
        run: |
          set -e
          git clone --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          git -C "$HOME/theos" submodule update --init --recursive --depth 1
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "THEOS_MAKE_PATH=$HOME/theos/makefiles" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"
          ls "$HOME/theos" | head

      - name: STEP4 install sdk
        run: |
          set -e
          mkdir -p "$HOME/theos/sdks"
          curl -fL --retry 3 -o /tmp/sdk.tar.xz \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xJf /tmp/sdk.tar.xz -C "$HOME/theos/sdks"
          ls -la "$HOME/theos/sdks"

      - name: STEP5 build deb
        run: |
          set -e
          export THEOS="$HOME/theos"
          export THEOS_MAKE_PATH="$THEOS/makefiles"
          export PATH="$THEOS/bin:$PATH"
          cd src/appdata
          echo "=== make -p 变量诊断 ==="
          make -p -n 2>/dev/null | grep -iE "^THEOS|^ARCHS|^TARGET|^TWEAK_NAME|_THEOS_RULES_LOADED|THEOS_CURRENT_INSTANCE" | head -30 || true
          echo "=== 是否有 package 规则 ==="
          make -p -n 2>/dev/null | grep -E "^package" | head -5 || echo "!! 没有 package 规则"
          echo "=== 手动 include 测试 ==="
          printf 'include %s/tweak.mk\nall:\n\t@echo included-ok\n' "$THEOS_MAKE_PATH" > /tmp/t.mk
          make -f /tmp/t.mk -n all 2>&1 | head -5 || true
          echo "=== real build ==="
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 2>&1 | tee /tmp/build.log
          echo "--- packages ---"
          ls -la packages/

      - name: STEP5b dump build log on failure
        if: failure()
        run: tail -200 /tmp/build.log || true

      - name: STEP6 upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: appdata-fila-rootless
          path: src/appdata/packages/*.deb
          if-no-files-found: error

      - name: STEP7 publish to source repo (main/debs + index)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          DEB_FILE=$(ls src/appdata/packages/*.deb | head -1)
          BASE=$(basename "$DEB_FILE")
          echo "publishing $BASE"

          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/repo"

          # 只取 main 分支（含 debs/ 与索引脚本）
          git clone --depth 1 --branch main \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" repo

          cd repo
          mkdir -p debs
          # 同包旧版本先删掉，只保留最新一份
          find debs -maxdepth 1 -name 'com.fouadraheb.appdata_*.deb' -delete || true
          cp "$GITHUB_WORKSPACE/$DEB_FILE" "debs/$BASE"

          echo "--- debs now ---"
          ls -la debs | grep -i appdata || true

          # 重建索引（优先 tools/update.py）
          if [ -f tools/update.py ]; then
            python3 tools/update.py || echo "!! tools/update.py failed"
          fi
          if [ -f gen_packages.py ]; then
            python3 gen_packages.py || echo "!! gen_packages.py failed"
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit (deb unchanged)"
          else
            git commit -m "ci: publish AppData(Fila) rootless $BASE"
            git push origin HEAD:main
            echo "PUBLISHED OK"
          fi
