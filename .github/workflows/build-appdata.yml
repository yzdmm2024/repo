name: Build AppData (Fila, rootless) -> publish to source

on:
  push:
    branches: [ appdata ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Show env
        run: |
          echo "actor=${{ github.actor }}"
          echo "repo=${{ github.repository }}"
          echo "ref=${{ github.ref }}"
          git --version
          python3 --version

      # 不用 actions/checkout，直接 git clone（排除 checkout action 的干扰）
      - name: Clone appdata branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git clone --depth 1 -b appdata \
            "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            src
          ls -la src
          ls -la src/appdata

      - name: Install Theos + iOS SDK
        run: |
          set -e
          export THEOS="$HOME/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          SDK_URL="https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          curl -fsSL -o "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz" "$SDK_URL"
          tar -xJf "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz" -C "$THEOS/sdks"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"

      - name: Build rootless deb
        run: |
          set -e
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          cd src/appdata
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
          ls -la packages/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: appdata-fila-rootless
          path: src/appdata/packages/*.deb
          if-no-files-found: error

      - name: Publish to main debs/
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git clone --depth 1 -b main \
            "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            dst
          shopt -s nullglob
          debs=(src/appdata/packages/*.deb)
          [ ${#debs[@]} -gt 0 ] || { echo "no deb"; exit 1; }
          mkdir -p dst/debs
          for f in "${debs[@]}"; do cp -f "$f" dst/debs/; echo "+ debs/$(basename "$f")"; done
          cd dst
          python3 tools/update.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "AppData (Fila) $(date +%Y%m%d-%H%M): build & publish"
            git push origin main
            echo "PUSHED to main"
          fi
