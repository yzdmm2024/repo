name: Build AppData (Fila, rootless) -> publish to source

on:
  push:
    branches: [ appdata ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostic
        run: |
          echo "actor: ${{ github.actor }}"
          echo "ref: ${{ github.ref }}"
          echo "sha: ${{ github.sha }}"
          echo "event: ${{ github.event_name }}"

      - name: Checkout appdata branch
        uses: actions/checkout@v4

      - name: Verify source present
        run: |
          echo "== working tree =="
          ls -la
          echo "== appdata dir =="
          ls -la appdata || { echo "ERROR: appdata/ missing"; exit 1; }

      - name: Install Theos + iOS SDK
        run: |
          set -e
          export THEOS="$HOME/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fsSL -o "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz" \
            https://github.com/theos/sdks/releases/download/master-20240217/iPhoneOS16.5.sdk.tar.xz
          tar -xJf "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz" -C "$THEOS/sdks"
          ls -la "$THEOS/sdks"

      - name: Build rootless deb
        run: |
          set -e
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          cd appdata
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
          echo "== built =="
          ls -la packages/

      - name: Upload artifact (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: appdata-fila-rootless
          path: appdata/packages/*.deb
          if-no-files-found: error

      # ---------- 发布到 main：用带 token 的 clone（比二次 checkout 稳） ----------
      - name: Clone main and copy deb
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            -b main repo-main
          shopt -s nullglob
          debs=(appdata/packages/*.deb)
          if [ ${#debs[@]} -eq 0 ]; then echo "no deb built"; exit 1; fi
          mkdir -p repo-main/debs
          for f in "${debs[@]}"; do
            cp -f "$f" repo-main/debs/
            echo "  + debs/$(basename "$f")"
          done
          cd repo-main
          python3 tools/update.py
          echo "== index rebuilt =="

      - name: Commit and push to main
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd repo-main
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "AppData (Fila) $(date +%Y%m%d-%H%M): build & publish"
            git push origin main
            echo "pushed to main"
          fi
