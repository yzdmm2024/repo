name: Regen Packages

on:
  push:
    branches: [main]
    paths:
      - 'debs/**'
      - 'gen_packages.py'

jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: regen index
        run: python3 gen_packages.py
      - name: commit index
        run: |
          git config user.email "repo-bot@users.noreply.github.com"
          git config user.name "repo-bot"
          git add Packages Packages.gz Packages.bz2 Release
          git diff --cached --quiet || (git commit -m "regen Packages" && git push)
