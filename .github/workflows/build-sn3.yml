# Build SN3extension on GitHub's macOS runner, then update this source's
# Packages/Release metadata and push back so GitHub Pages refreshes the repo.
#
# Trigger: manual only (workflow_dispatch). 避免自动 push 引发循环。
name: Build SN3extension & update source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Checkout SN3extension source
        uses: actions/checkout@v4
        with:
          repository: yzdmm2024/SN3extension
          ref: main
          path: SN3extension

      - name: Install Theos
        run: |
          brew install xz ldid >/dev/null 2>&1 || true
          git clone --depth=1 --recursive https://github.com/theos/theos "$HOME/theos"

      - name: Build prefs executable & inject into layout
        working-directory: SN3extension/PreferenceBundles/Snapper3ZhExtPrefs
        env:
          THEOS: /Users/runner/theos
          THEOS_PACKAGE_SCHEME: rootless
        run: |
          make TARGET="iphone:clang:latest:14.0"
          B="../../layout/Library/PreferenceBundles/Snapper3ZhExtPrefs.bundle"
          mkdir -p "$B"
          DYLIB=$(find .theos . -path ./.git -prune -o -name "Snapper3ZhExtPrefs" -type f -print 2>/dev/null | head -1)
          [ -n "$DYLIB" ] || DYLIB=$(find .theos . -path ./.git -prune -o -name "Snapper3ZhExtPrefs.dylib" -print 2>/dev/null | head -1)
          echo "found: $DYLIB"
          cp -f "$DYLIB" "$B/Snapper3ZhExtPrefs"
          ls -la "$B"

      - name: Build package
        working-directory: SN3extension
        env:
          THEOS: /Users/runner/theos
          THEOS_PACKAGE_SCHEME: rootless
        run: |
          make clean package FINALPACKAGE=1 TARGET="iphone:clang:latest:14.0"

      - name: Stage deb & regenerate metadata
        run: |
          set -e
          mkdir -p debs
          cp -f SN3extension/packages/*.deb debs/
          python3 tools/update.py

      - name: Commit & push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          NEWDEB=$(ls debs/*snapper3zhext*.deb 2>/dev/null | head -n1 || true)
          git commit -m "update: SN3延伸板 ${NEWDEB:-}"
          git push origin main