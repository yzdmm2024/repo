# Build 随机开启app (arm64e) on GitHub's macOS runner, stage deb, regen index, push.
# Trigger: manual only (workflow_dispatch), or dispatch true once working.
name: Build 随机开启app & update source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout this repo (contains randopenapp theos project)
        uses: actions/checkout@v4

      - name: Install Theos toolchain
        run: |
          brew install xz ldid >/dev/null 2>&1 || true
          git clone --depth=1 --recursive https://github.com/theos/theos "$HOME/theos" || true

      - name: Build package (arm64+arm64e)
        working-directory: randopenapp
        env:
          THEOS: /Users/runner/theos
          THEOS_PACKAGE_SCHEME: roothide
        run: |
          make clean package FINALPACKAGE=1 TARGET="iphone:clang:latest:14.0"
          ls -la packages/ || true

      - name: Stage deb & regenerate metadata
        run: |
          set -e
          mkdir -p debs
          # clean old roa versions from index, keep the newest
          cp -f randopenapp/packages/*.deb debs/ 2>/dev/null || true
          ls -la debs/ | grep -i rand || echo "no rand deb"
          python3 tools/update.py

      - name: Commit & push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          NEWDEB=$(ls debs/*randopenapp*.deb debs/*随机开启app*.deb 2>/dev/null | head -n1 || true)
          git commit -m "update: 随机开启app arm64e ${NEWDEB:-}"
          git push origin main